<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Cary Hotels by District</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.0/dist/leaflet.css"/>
	<link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.14.0/css/all.css">
    <link href="https://fonts.googleapis.com/css?family=Titillium+Web" rel="stylesheet">

<style>
html, body, #map { width: 100%; height: 100%; margin: 0; background: #fff; }

    .legend {
    line-height: 40px;
    font-size: 16px;
    width: 190px;
    color: #333333;
    padding: 6px 8px;
    background: white;
    background: rgba(255,255,255,0.5);
    box-shadow: 0 0 15px rgba(0,0,0,0.2);
    border-radius: 5px;
}
 
    .legend i {
    width: 20px;
    height: 20px;
    float: left;
    margin-right: 8px;
    opacity: 0.9;
}
 
    .legend img {
    width: 16px;
    height: 16px;
    margin-right: 3px;
    float: left;
}
 
    .legend p {
    font-size: 14px;
    line-height: 20px;
    margin: 0;
}

.legend {
    font-family: 'Titillium Web', sans-serif;
}
    
</style>

	<script src="https://unpkg.com/leaflet@1.7.0/dist/leaflet.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-ajax/2.1.0/leaflet.ajax.min.js"></script>
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.1.0/jquery.min.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/chroma-js/1.3.4/chroma.min.js"></script>

</head>
<body>
<div id="map"></div>
<script>

/////////////////
//1. Add Data
/////////////////

// 1. Create a map object.
var mymap = L.map('map', {
    center: [35.7915,-78.7811], 
    zoom: 12,
    maxZoom: 18,
    minZoom: 11,
    detectRetina: true 
});

// 2. Add a base map.
L.tileLayer('http://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png').addTo(mymap);

// 3. Add Hotel GeoJSON Data
var hotel_listings = null;

/////////////////
//2. Point Marker Visualization - Create Color Scheme
/////////////////

// 4. build up a set of colors from colorbrewer's dark2 category
var colors = chroma.scale('Dark2').mode('lch').colors(3);

// 5. dynamically append style classes to this page.
for (i = 0; i < 3; i++) {
    $('head').append(
        $("<style> .marker-color-" + (i + 1).toString() +
        " { color: " + colors[i] + "; font-size: 15px; text-shadow: 0 0 3px #ffffff;} </style>")
    );
}

////////////////
//2. Add a pop-up with onEachFeature
/////////////////

hotel_listings = L.geoJson.ajax("assets/hotels_cary_classified.geojson",{
 
onEachFeature: function (feature, layer) {
    layer.bindPopup(feature.properties.name);
  },
 
  pointToLayer: function(feature, latlng) {
      var id = 0;

      if (feature.properties.HotelType == "Chain") { id = 0; }
      else if (feature.properties.HotelType == "Extended Stay") { id = 1; }
      else { id = 2;}

      return L.marker(latlng, {
          icon: L.divIcon({
              className: 'fas fa-hotel marker-color-' + (id + 1).toString()
          })
      });
  },

    attribution: 'Hotels © OSM & User Classification | Cary Districts © Town of Cary | Base Map © CartoDB | Map Author: '
}).addTo(mymap);


/////////////////
//3. Polygon visualization
/////////////////

// 6. Set function for color ramp
colors = chroma.scale('Oranges').colors(5); 
 
// Classification based on Hotel_Count (min 2, max 19)
function setColor(count) {
    var id = 0;
    if (count >= 16) { id = 4; }
    else if (count >= 13 && count < 16) { id = 3; }
    else if (count >= 9 && count < 13) { id = 2; }
    else if (count >= 5 && count < 9) { id = 1; }
    else { id = 0; }
    return colors[id];
}

/////////////////
//3. Apply color palette
/////////////////

// 7. Set style function
function style(feature) {
    return {
        fillColor: setColor(feature.properties.Hotel_Count),
        fillOpacity: 0.4,
        weight: 2,
        opacity: 1,
        color: '#b4b4b4',
        dashArray: '4'
    };
}

// 8. Add district polygons
L.geoJson.ajax("assets/council-districts.geojson", {
    style: style
}).addTo(mymap);

/////////////////
//4. Other Map Elements - Legend
/////////////////

var legend = L.control({position: 'topright'});
 
// 10. Function that runs when legend is added to map
legend.onAdd = function () {
    var div = L.DomUtil.create('div', 'legend');

    div.innerHTML += '<b>Hotels per District</b><br />';
    div.innerHTML += '<i style="background:' + colors[4] + '; opacity:0.5"></i><p>16–19</p>';
    div.innerHTML += '<i style="background:' + colors[3] + '; opacity:0.5"></i><p>13–15</p>';
    div.innerHTML += '<i style="background:' + colors[2] + '; opacity:0.5"></i><p>9–12</p>';
    div.innerHTML += '<i style="background:' + colors[1] + '; opacity:0.5"></i><p>5–8</p>';
    div.innerHTML += '<i style="background:' + colors[0] + '; opacity:0.5"></i><p>2–4</p>';

    div.innerHTML += '<hr><b>Hotel Type</b><br />';
    div.innerHTML += '<i class="fas fa-hotel marker-color-1"></i><p>Chain</p>';
    div.innerHTML += '<i class="fas fa-hotel marker-color-2"></i><p>Extended Stay</p>';
    div.innerHTML += '<i class="fas fa-hotel marker-color-3"></i><p>Independent</p>';

    return div;
};
 
legend.addTo(mymap);

L.control.scale({position: 'bottomleft'}).addTo(mymap);

</script>
</body>
</html>
